<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>テトリス</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      color: #eee;
    }

    #game-container {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }

    #board-wrapper {
      position: relative;
    }

    canvas#board {
      display: block;
      border: 2px solid #444;
      background: #0d0d1a;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,0.75);
      gap: 16px;
    }

    #overlay h2 { font-size: 2rem; letter-spacing: 2px; color: #e94560; }
    #overlay p  { font-size: 1rem; color: #aaa; }

    #start-btn {
      padding: 12px 32px;
      font-size: 1.1rem;
      font-family: inherit;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.2s;
    }
    #start-btn:hover { background: #c73652; }

    #side-panel {
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-width: 130px;
    }

    .panel-box {
      background: #16213e;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 12px;
    }

    .panel-box h3 {
      font-size: 0.75rem;
      color: #888;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .panel-box .value {
      font-size: 1.6rem;
      color: #e94560;
      font-weight: bold;
    }

    canvas#next {
      display: block;
      background: #0d0d1a;
      border: 1px solid #333;
    }

    #controls {
      font-size: 0.72rem;
      color: #666;
      line-height: 1.8;
    }
    #controls span { color: #aaa; }
  </style>
</head>
<body>

<div id="game-container">
  <div id="board-wrapper">
    <canvas id="board" width="300" height="600"></canvas>
    <div id="overlay">
      <h2>TETRIS</h2>
      <p>キーボードで操作</p>
      <button id="start-btn">スタート</button>
    </div>
  </div>

  <div id="side-panel">
    <div class="panel-box">
      <h3>Score</h3>
      <div class="value" id="score">0</div>
    </div>
    <div class="panel-box">
      <h3>Level</h3>
      <div class="value" id="level">1</div>
    </div>
    <div class="panel-box">
      <h3>Lines</h3>
      <div class="value" id="lines">0</div>
    </div>
    <div class="panel-box">
      <h3>Next</h3>
      <canvas id="next" width="120" height="120"></canvas>
    </div>
    <div class="panel-box" id="controls">
      <h3>操作方法</h3>
      <span>←→</span> 移動<br>
      <span>↑</span> 回転<br>
      <span>↓</span> 落下<br>
      <span>Space</span> 即落<br>
      <span>P</span> 一時停止
    </div>
  </div>
</div>

<script>
const COLS = 10, ROWS = 20, CELL = 30;

const SHAPES = {
  I: { cells: [[0,0],[1,0],[2,0],[3,0]], color: '#00cfcf' },
  O: { cells: [[0,0],[1,0],[0,1],[1,1]], color: '#f0c000' },
  T: { cells: [[1,0],[0,1],[1,1],[2,1]], color: '#a000f0' },
  S: { cells: [[1,0],[2,0],[0,1],[1,1]], color: '#00b000' },
  Z: { cells: [[0,0],[1,0],[1,1],[2,1]], color: '#e03030' },
  J: { cells: [[0,0],[0,1],[1,1],[2,1]], color: '#0040e0' },
  L: { cells: [[2,0],[0,1],[1,1],[2,1]], color: '#e07000' },
};
const SHAPE_KEYS = Object.keys(SHAPES);

const SCORES = [0, 100, 300, 500, 800];

const boardCanvas = document.getElementById('board');
const nextCanvas  = document.getElementById('next');
const ctx  = boardCanvas.getContext('2d');
const nctx = nextCanvas.getContext('2d');

let board, current, next, score, level, lines, dropInterval, lastTime, paused, running, animId;

function newBoard() {
  return Array.from({length: ROWS}, () => Array(COLS).fill(null));
}

function randomPiece() {
  const key = SHAPE_KEYS[Math.floor(Math.random() * SHAPE_KEYS.length)];
  const s = SHAPES[key];
  return {
    cells: s.cells.map(c => [...c]),
    color: s.color,
    x: Math.floor(COLS / 2) - 2,
    y: 0,
  };
}

function rotate(cells) {
  const maxX = Math.max(...cells.map(c => c[0]));
  return cells.map(([x, y]) => [maxX - y, x]);
}

function isValid(cells, ox, oy) {
  return cells.every(([x, y]) => {
    const nx = x + ox, ny = y + oy;
    return nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && !board[ny][nx];
  });
}

function place() {
  current.cells.forEach(([x, y]) => {
    const nx = x + current.x, ny = y + current.y;
    if (ny >= 0) board[ny][nx] = current.color;
  });
}

function clearLines() {
  let cleared = 0;
  for (let r = ROWS - 1; r >= 0; r--) {
    if (board[r].every(c => c !== null)) {
      board.splice(r, 1);
      board.unshift(Array(COLS).fill(null));
      cleared++;
      r++;
    }
  }
  if (cleared) {
    lines += cleared;
    score += SCORES[cleared] * level;
    level = Math.floor(lines / 10) + 1;
    dropInterval = Math.max(100, 1000 - (level - 1) * 90);
    updateUI();
  }
}

function spawnNext() {
  current = next;
  next = randomPiece();
  if (!isValid(current.cells, current.x, current.y)) {
    gameOver();
  }
}

function ghostY() {
  let dy = 0;
  while (isValid(current.cells, current.x, current.y + dy + 1)) dy++;
  return current.y + dy;
}

function drawCell(c, x, y, alpha) {
  c.globalAlpha = alpha ?? 1;
  c.fillStyle = '#0d0d1a';
  c.fillRect(x * CELL, y * CELL, CELL, CELL);
  c.fillStyle = arguments[4] || current?.color || '#fff';
  c.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);

  // highlight
  c.fillStyle = 'rgba(255,255,255,0.25)';
  c.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, 4);
  c.fillRect(x * CELL + 1, y * CELL + 1, 4, CELL - 2);
  c.globalAlpha = 1;
}

function drawBoard() {
  ctx.clearRect(0, 0, boardCanvas.width, boardCanvas.height);

  // grid
  ctx.strokeStyle = '#1c1c30';
  ctx.lineWidth = 0.5;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    ctx.strokeRect(c * CELL, r * CELL, CELL, CELL);
  }

  // placed
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (board[r][c]) {
      ctx.fillStyle = board[r][c];
      ctx.fillRect(c * CELL + 1, r * CELL + 1, CELL - 2, CELL - 2);
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.fillRect(c * CELL + 1, r * CELL + 1, CELL - 2, 4);
      ctx.fillRect(c * CELL + 1, r * CELL + 1, 4, CELL - 2);
    }
  }

  // ghost
  const gy = ghostY();
  if (gy !== current.y) {
    ctx.globalAlpha = 0.2;
    current.cells.forEach(([x, y]) => {
      const nx = x + current.x, ny = y + gy;
      ctx.fillStyle = current.color;
      ctx.fillRect(nx * CELL + 1, ny * CELL + 1, CELL - 2, CELL - 2);
    });
    ctx.globalAlpha = 1;
  }

  // current piece
  current.cells.forEach(([x, y]) => {
    const nx = x + current.x, ny = y + current.y;
    if (ny >= 0) {
      ctx.fillStyle = current.color;
      ctx.fillRect(nx * CELL + 1, ny * CELL + 1, CELL - 2, CELL - 2);
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fillRect(nx * CELL + 1, ny * CELL + 1, CELL - 2, 5);
      ctx.fillRect(nx * CELL + 1, ny * CELL + 1, 5, CELL - 2);
    }
  });
}

function drawNext() {
  nctx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
  const nc = CELL * 0.85;
  const minX = Math.min(...next.cells.map(c => c[0]));
  const minY = Math.min(...next.cells.map(c => c[1]));
  const maxX = Math.max(...next.cells.map(c => c[0]));
  const maxY = Math.max(...next.cells.map(c => c[1]));
  const w = (maxX - minX + 1) * nc;
  const h = (maxY - minY + 1) * nc;
  const offX = (nextCanvas.width - w) / 2;
  const offY = (nextCanvas.height - h) / 2;
  next.cells.forEach(([x, y]) => {
    const px = offX + (x - minX) * nc;
    const py = offY + (y - minY) * nc;
    nctx.fillStyle = next.color;
    nctx.fillRect(px + 1, py + 1, nc - 2, nc - 2);
    nctx.fillStyle = 'rgba(255,255,255,0.3)';
    nctx.fillRect(px + 1, py + 1, nc - 2, 4);
    nctx.fillRect(px + 1, py + 1, 4, nc - 2);
  });
}

function updateUI() {
  document.getElementById('score').textContent = score;
  document.getElementById('level').textContent = level;
  document.getElementById('lines').textContent = lines;
}

function loop(ts) {
  if (!running) return;
  if (!lastTime) lastTime = ts;
  if (!paused && ts - lastTime >= dropInterval) {
    lastTime = ts;
    if (isValid(current.cells, current.x, current.y + 1)) {
      current.y++;
    } else {
      place();
      clearLines();
      spawnNext();
    }
  }
  drawBoard();
  drawNext();
  animId = requestAnimationFrame(loop);
}

function startGame() {
  board = newBoard();
  score = 0; level = 1; lines = 0;
  dropInterval = 1000;
  lastTime = 0; paused = false; running = true;
  next = randomPiece();
  spawnNext();
  updateUI();
  document.getElementById('overlay').style.display = 'none';
  cancelAnimationFrame(animId);
  animId = requestAnimationFrame(loop);
}

function gameOver() {
  running = false;
  const ov = document.getElementById('overlay');
  ov.innerHTML = `
    <h2>GAME OVER</h2>
    <p>スコア: <strong style="color:#e94560">${score}</strong></p>
    <button id="start-btn">もう一度</button>
  `;
  ov.style.display = 'flex';
  document.getElementById('start-btn').addEventListener('click', startGame);
}

document.getElementById('start-btn').addEventListener('click', startGame);

document.addEventListener('keydown', e => {
  if (!running) return;
  switch (e.code) {
    case 'ArrowLeft':
      if (isValid(current.cells, current.x - 1, current.y)) current.x--;
      break;
    case 'ArrowRight':
      if (isValid(current.cells, current.x + 1, current.y)) current.x++;
      break;
    case 'ArrowDown':
      if (isValid(current.cells, current.x, current.y + 1)) { current.y++; lastTime = performance.now(); }
      break;
    case 'ArrowUp': {
      const rotated = rotate(current.cells);
      if (isValid(rotated, current.x, current.y)) current.cells = rotated;
      break;
    }
    case 'Space': {
      e.preventDefault();
      current.y = ghostY();
      place();
      clearLines();
      spawnNext();
      lastTime = performance.now();
      break;
    }
    case 'KeyP':
      paused = !paused;
      if (!paused) { lastTime = 0; }
      break;
  }
});
</script>
</body>
</html>
