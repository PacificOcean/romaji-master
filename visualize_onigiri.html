<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>おにぎりくん ピクセル可視化</title>
    <style>
        body {
            background: #1d2b53;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
            font-family: monospace;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
        h2 { color: #000; margin: 0 0 10px 0; }
        canvas { border: 2px solid #000; image-rendering: pixelated; }
        .pixel-data {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            max-width: 600px;
            overflow-x: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🍙 おにぎりくん - 通常顔</h2>
    <canvas id="normal" width="320" height="320"></canvas>
    <div class="pixel-data">
        <strong>ピクセルデータ:</strong>
        <pre id="normalData"></pre>
    </div>
</div>

<div class="container">
    <h2>😊 おにぎりくん - 喜び</h2>
    <canvas id="happy" width="320" height="320"></canvas>
    <div class="pixel-data">
        <strong>ピクセルデータ:</strong>
        <pre id="happyData"></pre>
    </div>
</div>

<div class="container">
    <h2>😨 おにぎりくん - 怖い</h2>
    <canvas id="scared" width="320" height="320"></canvas>
    <div class="pixel-data">
        <strong>ピクセルデータ:</strong>
        <pre id="scaredData"></pre>
    </div>
</div>

<div class="container">
    <h2>🤩 おにぎりくん - 興奮</h2>
    <canvas id="excited" width="320" height="320"></canvas>
    <div class="pixel-data">
        <strong>ピクセルデータ:</strong>
        <pre id="excitedData"></pre>
    </div>
</div>

<script>
// Pyxelパレット
const palette = {
    '0': '#000000', '1': '#1d2b53', '2': '#7e2553', '3': '#008751',
    '4': '#ab5236', '5': '#5f574f', '6': '#c2c3c7', '7': '#fff1e8',
    '8': '#ff004d', '9': '#ffa300', 'a': '#ab5236', 'b': '#00e436',
    'c': '#c2c3c7', 'd': '#83769c', 'e': '#ff77a8', 'f': '#ffccaa'
};

const faces = {
    'normal': [
        'cccccccccccccccc',
        'cccccccccccccccc',
        'cccccca9a9c9cccc',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000'
    ],
    'happy': [
        'cccccccccccccccc',
        'cccccccccccccccc',
        'ccccac9a9caccccc',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000'
    ],
    'scared': [
        'cccccc7777cccccc',
        'cccccccccccccccc',
        'cccc9a99aa99cccc',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000'
    ],
    'excited': [
        'ccc7777777777ccc',
        'cccd77777777dccc',
        'ccccccaa0ccccccc',
        '0000000880000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000',
        '0000000000000000'
    ]
};

function drawSprite(canvasId, pixelData, dataElementId) {
    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext('2d');
    const scale = 20; // 20倍に拡大

    // Pyxelの背景色（青）で背景を塗る
    ctx.fillStyle = '#29adff'; // Pyxel color 12
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // ピクセルデータを描画
    for (let row = 0; row < 16; row++) {
        for (let col = 0; col < 16; col++) {
            const colorKey = pixelData[row][col];
            const color = palette[colorKey];

            // 描画（全ピクセル）
            ctx.fillStyle = color;
            ctx.fillRect(col * scale, row * scale, scale, scale);
        }
    }

    // グリッドラインを描画
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 0.5;
    for (let i = 0; i <= 16; i++) {
        ctx.beginPath();
        ctx.moveTo(i * scale, 0);
        ctx.lineTo(i * scale, 16 * scale);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * scale);
        ctx.lineTo(16 * scale, i * scale);
        ctx.stroke();
    }

    // ピクセルデータを表示（パレット情報付き）
    const colorNames = {
        '0': 'BLACK', '1': 'NAVY', '2': 'PURPLE', '3': 'GREEN',
        '4': 'BROWN', '5': 'GRAY_DK', '6': 'GRAY', '7': 'WHITE',
        '8': 'RED', '9': 'ORANGE', 'a': 'BROWN2', 'b': 'LIME',
        'c': 'GRAY', 'd': 'LAVENDER', 'e': 'PINK', 'f': 'PEACH'
    };

    const dataElement = document.getElementById(dataElementId);
    const lines = pixelData.map((row, idx) => {
        const colors = row.split('').map(c => colorNames[c] || '?').join(' ');
        return `${idx.toString().padStart(2)}: ${row} → ${colors}`;
    }).join('\n');
    dataElement.textContent = lines;
}

// すべての顔を描画
drawSprite('normal', faces.normal, 'normalData');
drawSprite('happy', faces.happy, 'happyData');
drawSprite('scared', faces.scared, 'scaredData');
drawSprite('excited', faces.excited, 'excitedData');
</script>

</body>
</html>
